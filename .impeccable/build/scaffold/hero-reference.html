<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-3.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Boogaloo:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6f6f1}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:768px">
  <div class="r-overdue-alert-bar region chrome" data-region="overdue-alert-bar"><!-- top red follow-ups alert bar --></div>
  <div class="r-coupon-header-bar region chrome" data-region="coupon-header-bar"><!-- navy master lead coupon header bar --></div>
  <div class="r-lead-name-heading region text" data-region="lead-name-heading"><!-- lead name label and MARCUS VANCE headline --><p style="font-size:var(--r-lead-name-heading-font);font-family:var(--r-lead-name-heading-family),sans-serif;font-weight:var(--r-lead-name-heading-weight);line-height:1.05;margin:0">lead-name-heading</p></div>
  <div class="r-verified-badge region control" data-region="verified-badge"><!-- angled bordered verification badge: rebuild the control's chrome from the crop (comp-spec.mjs --crop verified-badge); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-primary-phone region text" data-region="primary-phone"><!-- primary phone label and number --><p style="font-size:var(--r-primary-phone-font);line-height:1.05;margin:0">primary-phone</p></div>
  <div class="r-secondary-phone region text" data-region="secondary-phone"><!-- secondary phone label and number --><p style="font-size:var(--r-secondary-phone-font);line-height:1.05;margin:0">secondary-phone</p></div>
  <div class="r-spec-grid-top region text" data-region="spec-grid-top"><!-- three-column spec row for source, request, and property type --><p style="font-size:var(--r-spec-grid-top-font);line-height:1.05;margin:0">spec-grid-top</p></div>
  <div class="r-spec-grid-bottom region text" data-region="spec-grid-bottom"><!-- three-column spec row for area, budget, and added date --><p style="font-size:var(--r-spec-grid-bottom-font);line-height:1.05;margin:0">spec-grid-bottom</p></div>
  <div class="r-status-group region control" data-region="status-group"><!-- lead status heading and nine status selector pills: rebuild the control's chrome from the crop (comp-spec.mjs --crop status-group); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-action-call region control" data-region="action-call"><!-- navy call tel action button: rebuild the control's chrome from the crop (comp-spec.mjs --crop action-call); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-action-whatsapp region control" data-region="action-whatsapp"><!-- purple whatsapp edit message action button: rebuild the control's chrome from the crop (comp-spec.mjs --crop action-whatsapp); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-action-log-call region control" data-region="action-log-call"><!-- red log call action button: rebuild the control's chrome from the crop (comp-spec.mjs --crop action-log-call); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-general-notes-box region text" data-region="general-notes-box"><!-- bordered general notes header and paragraph block --><p style="font-size:var(--r-general-notes-box-font);line-height:1.05;margin:0">general-notes-box</p></div>
  <div class="r-timeline-heading region text" data-region="timeline-heading"><!-- call log and feedback timeline section title --><p style="font-size:var(--r-timeline-heading-font);line-height:1.05;margin:0">timeline-heading</p></div>
  <div class="r-call-leg-04 region text" data-region="call-leg-04"><!-- call leg 04 timeline row with vertical stripe code and feedback text --><p style="font-size:var(--r-call-leg-04-font);line-height:1.05;margin:0">call-leg-04</p></div>
  <div class="r-call-leg-03 region text" data-region="call-leg-03"><!-- call leg 03 timeline row with vertical stripe code and outcome --><p style="line-height:1.05;margin:0">call-leg-03</p></div>
  <div class="r-call-leg-02 region text" data-region="call-leg-02"><!-- call leg 02 timeline row with vertical stripe code and outcome --><p style="font-size:var(--r-call-leg-02-font);line-height:1.05;margin:0">call-leg-02</p></div>
</main>
</body>
</html>
